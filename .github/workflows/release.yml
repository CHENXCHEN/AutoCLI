name: Release

on:
  push:
    branches:
      - 'codex/release-v039-recovery'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21fc5c7b1ffd1e43e8ae2330fdafcd1314a439df
      - name: Check tag commit
        run: |
          test "$(git ls-remote origin refs/tags/v0.3.9 | cut -f1)" = "21fc5c7b1ffd1e43e8ae2330fdafcd1314a439df"

  build:
    name: Build ${{ matrix.target }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21fc5c7b1ffd1e43e8ae2330fdafcd1314a439df

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux-musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (ARM Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../autocli-${{ matrix.target }}.tar.gz autocli
          cd ../../..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/autocli.exe -DestinationPath autocli-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocli-${{ matrix.target }}
          path: autocli-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  extension:
    name: Build Chrome Extension
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21fc5c7b1ffd1e43e8ae2330fdafcd1314a439df

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Package extension
        run: |
          cd extension
          zip -r ../autocli-chrome-extension.zip dist/ icons/ selector/ reader/ manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocli-chrome-extension
          path: autocli-chrome-extension.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21fc5c7b1ffd1e43e8ae2330fdafcd1314a439df

      - name: Check release tag and absence of existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/tags/v0.3.9 | cut -f1)" = "21fc5c7b1ffd1e43e8ae2330fdafcd1314a439df"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v0.3.9")
          test "$status" = 404

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Generate checksums
        run: |
          cd artifacts
          for file in \
            autocli-aarch64-apple-darwin.tar.gz \
            autocli-x86_64-apple-darwin.tar.gz \
            autocli-x86_64-unknown-linux-musl.tar.gz \
            autocli-aarch64-unknown-linux-musl.tar.gz \
            autocli-x86_64-pc-windows-msvc.zip \
            autocli-chrome-extension.zip; do
            artifact="${file%.tar.gz}"
            artifact="${artifact%.zip}"
            test -s "$artifact/$file"
            mv "$artifact/$file" .
          done
          sha256sum autocli-*.tar.gz autocli-*.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.9
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/autocli-*.tar.gz
            artifacts/autocli-*.zip
            artifacts/SHA256SUMS.txt
